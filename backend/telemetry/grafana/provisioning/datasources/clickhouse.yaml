apiVersion: 1
datasources:
  - name: Telemetry ClickHouse
    uid: telemetry-clickhouse
    type: grafana-clickhouse-datasource
    access: proxy
    jsonData:
      host: clickhouse
      port: 8123
      protocol: http
      username: grafana_reader
      defaultDatabase: telemetry
    secureJsonData:
      password: ${CLICKHOUSE_READ_PASSWORD}
