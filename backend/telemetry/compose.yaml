services:
  clickhouse:
    image: clickhouse/clickhouse-server:25.8
    environment:
      CLICKHOUSE_DB: telemetry
      CLICKHOUSE_USER: bootstrap
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_ADMIN_PASSWORD:?Set a strong bootstrap password}
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: "1"
    volumes:
      - clickhouse_data:/var/lib/clickhouse
      - ./clickhouse/migrations:/docker-entrypoint-initdb.d:ro
    networks: [analytics]
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8123/ping"]
      interval: 15s
      timeout: 5s
      retries: 5
    restart: unless-stopped
  ingest:
    build:
      context: ../..
      dockerfile: backend/telemetry/ingest/Dockerfile
    environment:
      CLICKHOUSE_URL: http://clickhouse:8123/?date_time_input_format=best_effort
      CLICKHOUSE_USER: telemetry_ingest
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:?Set a strong server password}
      ALLOWED_GAMES: ${ALLOWED_GAMES:-echoes_of_the_rift}
    ports: ["8080:8080"]
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    networks: [analytics]
    depends_on:
      clickhouse:
        condition: service_healthy
    restart: unless-stopped
  grafana:
    image: grafana/grafana:12.2.0
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?Set a strong admin password}
      GF_PLUGINS_PREINSTALL: grafana-clickhouse-datasource
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      CLICKHOUSE_READ_PASSWORD: ${CLICKHOUSE_READ_PASSWORD:?Create the readonly account before using dashboards}
    ports: ["3000:3000"]
    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
    networks: [analytics]
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 5s
      retries: 5
    restart: unless-stopped
networks:
  analytics:
volumes:
  clickhouse_data:
  grafana_data:
